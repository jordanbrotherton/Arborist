name: Build RPM

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-rpm:
    runs-on: ubuntu-latest
    container:
      image: fedora:latest

    steps:
      - name: Install RPM build dependencies
        run: |
          dnf install -y rpmdevtools rpm-build meson ninja-build python3-devel gtk4-devel libadwaita-devel desktop-file-utils libappstream-glib git gettext

      - name: Checkout code
        uses: actions/checkout@v6.0.2

      - name: Mark workspace as safe for git in Fedora
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Set up RPM build tree and build
        run: |
          rpmdev-setuptree
          VERSION=$(rpmspec -q --qf "%{version}\n" arborist.spec | head -n 1)
          git archive --format=tar.gz --prefix="arborist-${VERSION}/" -o "$HOME/rpmbuild/SOURCES/arborist-${VERSION}.tar.gz" HEAD
          cp arborist.spec "$HOME/rpmbuild/SPECS/"
          rpmbuild -ba "$HOME/rpmbuild/SPECS/arborist.spec"
          mkdir -p dist
          cp "$HOME/rpmbuild/RPMS/noarch/"*.rpm dist/

      - name: Upload RPM Artifact
        uses: actions/upload-artifact@v7
        with:
          name: arborist-rpm
          path: dist/*.noarch.rpm
